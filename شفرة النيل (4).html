<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شفرة النيل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ead6;--card:#fffaf0;--tx:#1d2a3a;--mut:#6b6455;--gold:#b8860b;--lap:#1f4e8c;--ok:#1f7a4d;--bad:#b3392f;--ln:#d9c9a3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b2d;--card:#172640;--tx:#f2e8cf;--mut:#a9b3c4;--gold:#e0b84a;--lap:#6fa3e8;--ok:#4cc28a;--bad:#ef7a6f;--ln:#2c4268}}
:root[data-theme="dark"]{--bg:#0f1b2d;--card:#172640;--tx:#f2e8cf;--mut:#a9b3c4;--gold:#e0b84a;--lap:#6fa3e8;--ok:#4cc28a;--bad:#ef7a6f;--ln:#2c4268}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;line-height:1.7}
#app{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:2.6rem;font-weight:900;margin:.2em 0;color:var(--gold);letter-spacing:0}
.hg{font-family:'Noto Sans Egyptian Hieroglyphs','Segoe UI Historic','Segoe UI Symbol',sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;color:var(--mut)}
.card{background:var(--card);border:2px solid var(--ln);border-radius:14px;padding:16px;margin:12px 0}
.case{display:flex;gap:14px;align-items:center;width:100%;text-align:right;font:inherit;color:inherit;cursor:pointer}
.case:hover{border-color:var(--gold)}
.case .ic{font-size:2.2rem}.case b{font-size:1.15rem}.case small{display:block;color:var(--mut)}
.btn{background:var(--lap);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:700 1rem Cairo,sans-serif;cursor:pointer}
.btn.alt{background:transparent;color:var(--tx);border:2px solid var(--ln)}
.opt{display:block;width:100%;text-align:right;background:var(--card);color:var(--tx);border:2px solid var(--ln);border-radius:10px;padding:12px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--lap)}
.opt.g{border-color:var(--ok);background:rgba(76,194,138,.18)}.opt.b{border-color:var(--bad);background:rgba(239,122,111,.18)}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);width:100%}
.fb{border-radius:12px;padding:12px;margin-top:12px;border:2px solid}.fb.g{border-color:var(--ok)}.fb.b{border-color:var(--bad)}
.clue{padding:8px 12px;border-right:4px solid var(--gold);margin:6px 0;background:var(--card)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{background:var(--card);border:2px solid var(--ln);border-radius:10px;padding:8px 12px;font:inherit;color:var(--tx);cursor:pointer}
.chip.used{opacity:.35}
.glyph{font-size:2.4rem;line-height:1.2}
.key{display:flex;flex-direction:column;align-items:center;min-width:46px;font-size:.85rem;color:var(--mut)}
.key span:first-child{font-size:1.8rem;color:var(--tx)}
.seal{font-size:3rem}
h2{margin:.2em 0 .6em;font-size:1.3rem}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tab{background:var(--card);color:var(--tx);border:2px solid var(--ln);border-radius:10px;padding:8px 14px;font:700 .95rem Cairo,sans-serif;cursor:pointer}
.tab.active{background:var(--lap);color:#fff;border-color:var(--lap)}
.info-item{border-bottom:1px solid var(--ln);padding:10px 0}.info-item:last-child{border:0}
.badge{display:inline-block;background:rgba(184,134,11,.15);color:var(--gold);font-weight:700;font-size:.8rem;padding:2px 8px;border-radius:6px}
.inp{width:100%;padding:12px;border-radius:10px;border:2px solid var(--ln);background:var(--bg);color:var(--tx);font:700 1.05rem Cairo,sans-serif}
.cartouche{border:3px solid var(--gold);border-radius:999px;padding:14px 28px;display:inline-flex;gap:8px;background:rgba(184,134,11,.08);margin:14px 0;flex-wrap:wrap;justify-content:center;min-width:120px}
.small-mut{color:var(--mut);font-size:.9rem}
:root,:root:not([data-theme="light"]){--bg:#10002b;--card:#1d0b45;--tx:#fff4e0;--mut:#c9b8f0;--gold:#ffc300;--lap:#7b2ff7;--ok:#00e0a4;--bad:#ff4d6d;--ln:#4a2a8a}
body{background:radial-gradient(circle at 15% 0,#3a0ca3 0,transparent 45%),radial-gradient(circle at 95% 15%,#f72585 0,transparent 32%),var(--bg);background-attachment:fixed}
h1{background:linear-gradient(90deg,#ffc300,#ff4d6d,#f72585);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:linear-gradient(135deg,#f72585,#7b2ff7);box-shadow:0 4px 0 #3a0ca3;transition:transform .1s}.btn:active{transform:translateY(3px);box-shadow:none}
.tab.active{background:linear-gradient(135deg,#ffc300,#ff4d6d);color:#1a0033;border-color:transparent}
.case:hover,.opt:hover:not(:disabled){border-color:#ffc300;box-shadow:0 0 14px rgba(255,195,0,.45)}
.lang{background:var(--card);color:var(--tx);border:2px solid var(--ln);border-radius:10px;padding:8px;font:700 .9rem Cairo,sans-serif}
.gen{border:2px solid var(--c);border-right-width:8px;border-radius:12px;margin:10px 0;background:var(--card)}
.gen summary{padding:12px 14px;cursor:pointer;font-size:1.05rem}.gen .gb{padding:0 14px 14px}
.chip2{display:inline-block;background:var(--c);color:#14002e;font-weight:700;border-radius:999px;padding:3px 12px;margin:3px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-inline-end:6px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const MAP={ا:'𓄿',ب:'𓃀',ت:'𓏏',ر:'𓂋',ص:'𓋴',ك:'𓎡',ل:'𓃭',م:'𓅓',ن:'𓈖',ي:'𓇋'};
const CASES=[
{id:'a',ic:'🏺',t:'القضية الأولى: آثار مصر',d:'من الأهرامات إلى الجوامع والكنائس',q:[
{k:'clue',c:['بُني قبل نحو 4500 سنة','ظل أطول بناء صنعه الإنسان قرابة 3800 سنة','يقع في الجيزة'],o:['هرم خوفو','هرم زوسر','معبد الأقصر','قلعة صلاح الدين'],a:0,e:'هرم خوفو هو الهرم الأكبر في الجيزة، وهو من عجائب الدنيا السبع القديمة.'},
{k:'mc',q:'قلعة قايتباي بالإسكندرية بُنيت في موقع أي معلم قديم؟',o:['منارة الإسكندرية','معبد دندرة','هرم ميدوم','معبد أبو سمبل'],a:0,e:'بُنيت القلعة في القرن الخامس عشر على موقع منارة الإسكندرية من العصر اليوناني الروماني.'},
{k:'mc',q:'إلى أي عصر تنتمي الكنيسة المعلقة بمصر القديمة؟',o:['الفرعوني','القبطي','الحديث','اليوناني'],a:1,e:'الكنيسة المعلقة من أشهر الكنائس القبطية في القاهرة.'},
{k:'mc',q:'أين يقع المتحف القومي للحضارة المصرية؟',o:['الأقصر','أسوان','الفسطاط بالقاهرة','الإسكندرية'],a:2,e:'يقع في الفسطاط، وفيه قاعة المومياوات الملكية.'},
{k:'order',q:'رتّب العصور من الأقدم إلى الأحدث:',items:['الفرعوني','اليوناني الروماني','القبطي','الإسلامي'],e:'الفرعوني ثم اليوناني الروماني ثم القبطي ثم الإسلامي.'}]},
{id:'b',ic:'🏙️',t:'القضية الثانية: المدن الجديدة',d:'أجيال العمران من الأول إلى الرابع',q:[
{k:'mc',q:'العاصمة الإدارية الجديدة من أي جيل من المدن؟',o:['الأول','الثاني','الثالث','الرابع'],a:3,e:'تُصنَّف ضمن مدن الجيل الرابع.'},
{k:'mc',q:'العلمين الجديدة تقع على ساحل أي بحر؟',o:['الأحمر','المتوسط','قناة السويس','بحيرة ناصر'],a:1,e:'تقع على الساحل الشمالي الغربي على البحر المتوسط.'},
{k:'mc',q:'المنصورة الجديدة تتبع أي محافظة؟',o:['الدقهلية','أسوان','المنيا','الإسماعيلية'],a:0,e:'تتبع الدقهلية وتطل على البحر المتوسط.'},
{k:'clue',c:['من مدن الجيل الأول','تقع في محافظة الشرقية','اسمها يذكّر بحرب 1973'],o:['العاشر من رمضان','السادس من أكتوبر','الشروق','بدر'],a:0,e:'مدينة العاشر من رمضان من أولى المدن الصناعية الجديدة.'},
{k:'mc',q:'مدينة الجلالة الجديدة تطل على أي ساحل؟',o:['المتوسط','الأحمر (خليج السويس)','النيل','بحيرة قارون'],a:1,e:'تقع فوق هضبة الجلالة وتطل على خليج السويس.'}]},
{id:'c',ic:'🏛️',t:'القضية الثالثة: رؤساء الجمهورية',d:'من محمد نجيب إلى عبد الفتاح السيسي',q:[
{k:'order',q:'رتّب الرؤساء حسب تولّيهم الحكم:',items:['محمد نجيب','جمال عبد الناصر','أنور السادات','حسني مبارك','عبد الفتاح السيسي'],e:'نجيب (1953) ثم ناصر ثم السادات ثم مبارك ثم السيسي.'},
{k:'mc',q:'من أول رئيس لجمهورية مصر بعد إعلانها عام 1953؟',o:['محمد نجيب','جمال عبد الناصر','أنور السادات','حسني مبارك'],a:0,e:'محمد نجيب هو أول رئيس للجمهورية.'},
{k:'mc',q:'في عهد من وقعت حرب أكتوبر 1973؟',o:['عبد الناصر','السادات','مبارك','نجيب'],a:1,e:'حدث العبور في عهد الرئيس أنور السادات.'},
{k:'mc',q:'من الرئيس الذي أمّم قناة السويس عام 1956؟',o:['جمال عبد الناصر','حسني مبارك','محمد نجيب','السادات'],a:0,e:'أعلن عبد الناصر تأميم القناة في يوليو 1956.'},
{k:'mc',q:'مدة حكم حسني مبارك التقريبية؟',o:['10 سنوات','20 سنة','30 سنة','45 سنة'],a:2,e:'من 1981 إلى 2011 تقريباً.'}]},
{id:'d',ic:'𓂀',t:'القضية الرابعة: شفرة الهيروغليفية',d:'فك الرموز لفتح الخزانة الأخيرة',q:[
{k:'hiero',w:'نيل',e:'نيل: شريان الحياة في مصر.'},
{k:'hiero',w:'مصر',e:'مصر: أرض الحضارة.'},
{k:'hiero',w:'ملك',e:'ملك: كان يُكتب اسمه داخل خرطوش.'},
{k:'hiero',w:'كتاب',e:'كتاب: الكتبة كانوا من أهم الطبقات في مصر القديمة.'},
{k:'mc',q:'ما اسم الإطار البيضاوي الذي يحيط باسم الملك في الكتابة الهيروغليفية؟',o:['الخرطوش','المسلة','التابوت','الصولجان'],a:0,e:'الخرطوش يحمي اسم الملك.'}]}
];
const LV=[[0,'متدرب'],[400,'باحث آثار'],[900,'محقق أثري'],[1400,'كبير المحققين']];
let S={score:0,seals:{},c:null,i:0,ok:0,left:30,lock:false,cl:1,tm:null,pick:[]};
const $=s=>document.querySelector(s);
const sh=a=>[...a].sort(()=>Math.random()-.5);
const lvl=()=>LV.filter(l=>S.score>=l[0]).pop()[1];
const bar=()=>`<div class="top"><span>🏅 ${lvl()}</span><span>⭐ ${S.score}</span></div>`;
function homeBase(){
 clearInterval(S.tm);
 const done=Object.keys(S.seals).length>=4;
 $('#app').innerHTML=bar()+`<h1>شفرة النيل <span class="hg">𓂀</span></h1>
 <p>سُرقت شفرة النيل من القاهرة الخفية! اكشف الخيوط في أربع قضايا قبل أن تهرب العصابة.</p>`+
 CASES.map(c=>`<button class="card case" onclick="start('${c.id}')"><span class="ic hg">${c.ic}</span><span><b>${c.t}</b><small>${c.d}</small></span><span class="seal" style="margin-right:auto;font-size:1.8rem">${S.seals[c.id]||''}</span></button>`).join('')+
 (done?`<div class="card"><b>🎉 حللت اللغز!</b><p>وصلت إلى لقب «${lvl()}» بمجموع ${S.score} نقطة. أعد المحاولة لتحصل على أختام أعلى.</p></div>`:'');
}
function start(id){S.c=CASES.find(x=>x.id==id);S.i=0;S.ok=0;ask();}
function ask(){
 if(S.i>=S.c.q.length)return end();
 const q=S.c.q[S.i];S.lock=false;S.cl=1;S.left=30;S.pick=[];
 let body='';
 if(q.k=='mc'||q.k=='clue'){
  S.opts=sh(q.o.map((t,i)=>[t,i]));
  body=(q.k=='clue'?'<p>🔍 اكشف الخيوط لتحدد المكان:</p><div id="clues"></div><button class="btn alt" id="more" onclick="more()">اكشف خيطاً آخر (−40 نقطة)</button>':`<h2>${q.q}</h2>`)+
   S.opts.map((o,j)=>`<button class="opt" onclick="pickOpt(${j})">${o[0]}</button>`).join('');
 }else if(q.k=='order'){
  S.opts=sh(q.items);
  body=`<h2>${q.q}</h2><div class="row" id="ch"></div><div class="row" id="pl"></div><div class="row"><button class="btn alt" onclick="S.pick.pop();drawOrder()">تراجع</button><button class="btn" onclick="chkOrder()">تأكيد الترتيب</button></div>`;
 }else{
  body=`<h2>فك الشفرة: ما الكلمة المخفية؟</h2><div class="row hg glyph">${[...q.w].map(l=>MAP[l]).join(' ')}</div>
  <div class="row">${Object.entries(MAP).map(([l,g])=>`<div class="key"><span class="hg">${g}</span><span>${l}</span></div>`).join('')}</div>
  <div class="card glyph" id="ans" style="min-height:3rem">&nbsp;</div>
  <div class="row">${Object.keys(MAP).map(l=>`<button class="chip" onclick="addL('${l}')">${l}</button>`).join('')}</div>
  <div class="row"><button class="btn alt" onclick="S.pick.pop();drawH()">مسح حرف</button><button class="btn" onclick="chkH()">افتح الخزانة</button></div>`;
 }
 $('#app').innerHTML=bar()+`<div class="card"><div class="top"><span>${S.c.t.split(':')[1]}</span><span>سؤال ${S.i+1}/${S.c.q.length}</span></div><div class="bar" style="margin:8px 0"><i id="tb"></i></div>${body}<div id="fb"></div></div>`;
 if(q.k=='clue')drawClues();if(q.k=='order')drawOrder();
 clearInterval(S.tm);S.tm=setInterval(()=>{S.left-=.25;$('#tb').style.width=Math.max(S.left/30*100,0)+'%';if(S.left<=0)done(false);},250);
}
function drawClues(){const q=S.c.q[S.i];$('#clues').innerHTML=q.c.slice(0,S.cl).map(x=>`<div class="clue">${x}</div>`).join('');if(S.cl>=q.c.length)$('#more').style.display='none';}
function more(){if(!S.lock){S.cl++;drawClues();}}
function pickOpt(j){if(S.lock)return;const q=S.c.q[S.i];const ok=S.opts[j][1]==q.a;
 document.querySelectorAll('.opt').forEach((b,n)=>{b.disabled=true;if(S.opts[n][1]==q.a)b.classList.add('g');});
 if(!ok)document.querySelectorAll('.opt')[j].classList.add('b');done(ok);}
function drawOrder(){$('#ch').innerHTML=S.opts.map((t,i)=>`<button class="chip ${S.pick.includes(t)?'used':''}" onclick="addO('${t}')">${t}</button>`).join('');
 $('#pl').innerHTML=S.pick.map((t,i)=>`<span class="chip">${i+1}. ${t}</span>`).join('');}
function addO(t){if(!S.lock&&!S.pick.includes(t)){S.pick.push(t);drawOrder();}}
function chkOrder(){const q=S.c.q[S.i];if(S.pick.length<q.items.length||S.lock)return;done(S.pick.join()==q.items.join());}
function drawH(){$('#ans').innerHTML=S.pick.map(l=>`<span class="hg">${MAP[l]}</span>`).join(' ')+' <small>'+S.pick.join('')+'</small>';}
function addL(l){if(!S.lock){S.pick.push(l);drawH();}}
function chkH(){if(!S.lock)done(S.pick.join('')==S.c.q[S.i].w);}
function done(ok){if(S.lock)return;S.lock=true;clearInterval(S.tm);const q=S.c.q[S.i];
 const base=q.k=='clue'?160-(S.cl-1)*40:q.k=='mc'?100:150;
 const pts=ok?base+Math.ceil(S.left/3):0;S.score+=pts;S.ok+=ok?1:0;
 const last=S.i==S.c.q.length-1;
 $('#fb').innerHTML=`<div class="fb ${ok?'g':'b'}"><b>${ok?'أحسنت! +'+pts+' نقطة':(S.left<=0?'انتهى الوقت!':'ليس تماماً')}</b><p>${q.e}</p><button class="btn" onclick="S.i++;ask()">${last?'النتيجة':'التالي'}</button></div>`;}
function end(){const p=S.ok/S.c.q.length;const s=p>=.8?'🥇':p>=.5?'🥈':'🥉';
 if(!S.seals[S.c.id]||['🥉','🥈','🥇'].indexOf(s)>['🥉','🥈','🥇'].indexOf(S.seals[S.c.id]))S.seals[S.c.id]=s;
 $('#app').innerHTML=bar()+`<div class="card" style="text-align:center"><div class="seal">${s}</div><h2>ختم محقق أثري</h2><p>أجبت صح عن ${S.ok} من ${S.c.q.length}. مستواك الآن: ${lvl()}</p><button class="btn" onclick="home()">العودة للقضايا</button> <button class="btn alt" onclick="start('${S.c.id}')">إعادة القضية</button></div>`;}
const FMAP={'ا':'𓄿','أ':'𓄿','إ':'𓄿','آ':'𓄿','ى':'𓇋','ي':'𓇋','ب':'𓃀','ت':'𓏏','ث':'𓍿','ج':'𓆓','ح':'𓎛','خ':'𓐍','د':'𓂧','ذ':'𓊨','ر':'𓂋','ز':'𓊃','س':'𓋴','ش':'𓈙','ص':'𓋴','ض':'𓂧','ط':'𓏏','ظ':'𓊨','ع':'𓂝','غ':'𓌅','ف':'𓆑','ق':'𓈎','ك':'𓎡','ل':'𓃭','م':'𓅓','ن':'𓈖','ه':'𓉔','و':'𓅱'};
